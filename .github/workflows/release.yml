name: Release

# Push a tag like v2.0.0 to build every platform and attach the installers to a
# draft GitHub release. Publishing the draft makes it the update for everyone.
on:
  push:
    tags: ['v*']

env:
  # Keep the MongoDB test binary out of installs that get packaged.
  MONGOMS_DISABLE_POSTINSTALL: '1'

permissions:
  contents: write

jobs:
  publish:
    name: Publish (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: --arch=universal
          # rpm on 24.04 breaks electron-installer-redhat; 22.04 builds both packages.
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci && npm ci --prefix client && npm ci --prefix server
      - name: Check the tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm test
        if: runner.os == 'Linux'
      - run: npm run build
      - run: npx electron-forge publish ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Checksums
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # The app's updater on macOS and Linux only installs a download whose
      # SHA-256 matches this file.
      - name: Add SHA256SUMS to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --pattern '*'
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
