name: Release

# Push a tag like v2.0.0 to build every platform and attach the installers to a
# draft GitHub release. Publishing the draft makes it the update for everyone.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    name: Publish (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: --arch=universal
          - os: ubuntu-latest
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - name: Check the tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm test
        if: runner.os == 'Linux'
      - run: npm run build
      - run: npx electron-forge publish ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
