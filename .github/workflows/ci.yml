name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci && npm ci --prefix client && npm ci --prefix server
      - run: npm test
      - run: npm run build

  package:
    name: Package (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: --arch=universal
          # rpm on 24.04 breaks electron-installer-redhat; 22.04 builds both packages.
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci && npm ci --prefix client && npm ci --prefix server
      - run: npm run build
      - run: npx electron-forge make ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: arcjournal-${{ runner.os }}
          path: out/make/**
          retention-days: 7
